openapi: 3.1.0
info:
  title: Partner Account Quote Offer API
  description: '

    Get instant insurance quote estimates and manage referrals through our Partner API.

    To request an API key contact partnerships-team@steadily.com

    '
  version: 1.0-cc63f79
  x-logo:
    url: https://app.staging.steadily.com/static/images/steadily-logo.svg
    altText: Steadily
    href: /redoc
tags:
- name: Quote Offer
  description: '

    An Offer is an immutable offer for coverage extended to a customer.

    Offers are generated from draft quotes and provides a PDF quote document.


    Creating an offer requires no outstanding underwriting alerts on the quote.

    If alerts are present, the agent must bridge into the Steadily UI (via the `agent_ui_url` from the draft quote response)

    to resolve them before an offer can be generated.

    '
paths:
  /v1/agency/quote_offer:
    post:
      tags:
      - Quote Offer
      summary: Offer Quote
      description: Create an Immutable Offer from a Quote. (Lock Quote)
      operationId: offer_quote
      security:
      - HTTPBearer: []
      parameters:
      - name: aud
        in: query
        required: false
        schema:
          type: string
          default: steadily:api
          title: Aud
      - name: quote_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
      - name: offer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Offer Id
      - name: policy_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Req
              allOf:
              - $ref: '#/components/schemas/QuoteOfferCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agency/quote_offer/{offer_id}:
    get:
      tags:
      - Quote Offer
      summary: Get Offer
      description: Retrieve an existing Offer.
      operationId: get_offer
      security:
      - HTTPBearer: []
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Offer Id
      - name: aud
        in: query
        required: false
        schema:
          type: string
          default: steadily:api
          title: Aud
      - name: quote_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
      - name: policy_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Id
      requestBody:
        content:
          application/json:
            schema:
              title: Req
              anyOf:
              - $ref: '#/components/schemas/QuoteOfferCreateRequest'
              - $ref: '#/components/schemas/PolicyCreateRequest'
              - $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
