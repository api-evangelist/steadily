- aid: steadily:steadily-quote-estimates-api
  name: Steadily Quote Estimates API
  description: >-
    The Instant Estimate API is a one-step express API to quickly get a landlord insurance estimate you
    can display within your platform.


    To get started, you only need to send the address and a unique property_id from your system.

    You'll instantly get back a premium estimate and a link to a pre-filled application your customers
    can visit to finalize their quote.
  humanURL: https://api.steadily.com/redoc
