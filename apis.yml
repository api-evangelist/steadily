apis:
- aid: steadily:steadily-account-api
  name: Steadily Account API
  description: >-
    Steadily uses Bearer Tokens to authenticate requests to the quoting endpoints on behalf of some appointed
    agent.


    There's two steps to this process:

    1. Use your agency's Steadily API Key to request a bearer token for an appointed insurance agent.

    2. Use that bearer token to call all other quoting API endpoints by passing in an `Authorization:
    Bearer <token>` header.


    Using the bearer token is equivalent to that agent performing the same action through our quoting
    UI.
  humanURL: https://api.steadily.com/redoc
  baseURL: https://api.steadily.com
  tags:
  - Account
  properties:
  - type: OpenAPI
    url: openapi/steadily-account-api-openapi.yml
  - type: Documentation
    url: https://api.steadily.com/redoc
  - type: Documentation
    url: https://api.steadily.com/estimate-api/redoc
  - type: Documentation
    url: https://api.steadily.com/quote-rater/redoc
- aid: steadily:steadily-draft-quote-api
  name: Steadily Draft Quote API
  description: >-
    A Draft Quote is an editable draft of a policy.


    Create a new draft quote by passing in basic insured and property information to `POST /v1/agency/draft_quote`
    with an authenticated bearer token header.

    Provide any known details about the property in the request - Steadily will resolve the rest of the
    information from our data sources.


    Our requests and responses are designed to mirror each other so that the request structure is self-documenting.

    To perform updates, send back the full quote payload you got from create with any modifications made
    in-place.


    Use the `/price` endpoint to get a pricing breakdown and `/underwrite` to check for underwriting decisions
    and alerts.


    The response includes an `agent_ui_url` field — this is the URL used to bridge the agent into the
    Steadily UI

    to review the quote, resolve any underwriting alerts, and complete the bind flow.
  humanURL: https://api.steadily.com/redoc
  baseURL: https://api.steadily.com
  tags:
  - Draft Quote
  properties:
  - type: OpenAPI
    url: openapi/steadily-draft-quote-api-openapi.yml
  - type: Documentation
    url: https://api.steadily.com/redoc
  - type: Documentation
    url: https://api.steadily.com/estimate-api/redoc
  - type: Documentation
    url: https://api.steadily.com/quote-rater/redoc
- aid: steadily:steadily-lead-referrals-api
  name: Steadily Lead Referrals API
  description: >-
    Submit and retrieve lead referrals.


    Use the refer lead endpoint to submit a lead with full quote details and start the insurance quote
    process.

    You'll get back a quote estimate and a start_url for the customer to continue their application.

    You can retrieve the status of the lead through the get endpoint or use our reporting features to
    manage all referrals.
  humanURL: https://api.steadily.com/redoc
  baseURL: https://api.steadily.com
  tags:
