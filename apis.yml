aid: steadily
name: Steadily
description: >-
  Steadily is a US landlord-insurance provider — built by landlords, for landlords —
  writing rental-property policies in all 50 states with online quotes in minutes and
  coverage designed around how rental properties actually work. Its Partner API, a
  FastAPI-based REST service at api.steadily.com, lets property managers, lenders, and
  marketplaces generate instant insurance estimates, refer leads, and track bound
  policies. Appointed independent agencies use the companion Rater Quotes API to
  create, price, underwrite, and offer quotes directly from their rater. Steadily was
  founded by a landlord who could not find decent insurance for his own rental property.
